server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: notification-service
  boot:
    admin:
      client:
        url: ${ADMIN_SERVER_URL:http://localhost:9090}
        instance:
          service-base-url: ${SERVICE_BASE_URL:http://localhost:${SERVER_PORT:8087}}
          management-base-url: ${MANAGEMENT_BASE_URL:http://localhost:${SERVER_PORT:8087}}
          service-url: ${SERVICE_URL:${SERVICE_BASE_URL:http://localhost:${SERVER_PORT:8087}}}
          management-url: ${MANAGEMENT_URL:${MANAGEMENT_BASE_URL:http://localhost:${SERVER_PORT:8087}}/actuator}
          health-url: ${HEALTH_URL:${MANAGEMENT_BASE_URL:http://localhost:${SERVER_PORT:8087}}/actuator/health}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:notification_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    # DB_PASSWORD must come from .env or the deployment environment.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 3000
    loadbalancer:
      cache:
        enabled: true
        ttl: 35s
        capacity: 128
      retry:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  mail:
    from: ${MAIL_FROM:no-reply@inkwell.dev}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
        