server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  boot:
    admin:
      client:
        url: ${ADMIN_SERVER_URL:http://localhost:9090}
        instance:
          service-base-url: ${SERVICE_BASE_URL:http://localhost:${SERVER_PORT:8081}}
          management-base-url: ${MANAGEMENT_BASE_URL:http://localhost:${SERVER_PORT:8081}}
          service-url: ${SERVICE_URL:${SERVICE_BASE_URL:http://localhost:${SERVER_PORT:8081}}}
          management-url: ${MANAGEMENT_URL:${MANAGEMENT_BASE_URL:http://localhost:${SERVER_PORT:8081}}/actuator}
          health-url: ${HEALTH_URL:${MANAGEMENT_BASE_URL:http://localhost:${SERVER_PORT:8081}}/actuator/health}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auth_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    # DB_PASSWORD must come from .env or the deployment environment.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: profile,email
            redirect-uri: ${PUBLIC_GATEWAY_URL:http://localhost:8080}/login/oauth2/code/{registrationId}
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope: user:email
            redirect-uri: ${PUBLIC_GATEWAY_URL:http://localhost:8080}/login/oauth2/code/{registrationId}
  
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

security:
  jwt:
    # JWT_SECRET must be supplied from .env/Jenkins/EC2; do not commit token signing keys.
    secret: ${JWT_SECRET}
    access-minutes: ${JWT_ACCESS_MINUTES:60}
    refresh-days: ${JWT_REFRESH_DAYS:14}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth/success}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
  mail:
    from: ${MAIL_FROM:noreply@inkwell.dev}
    name: ${MAIL_FROM_NAME:InkWell}
  payment:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true
    