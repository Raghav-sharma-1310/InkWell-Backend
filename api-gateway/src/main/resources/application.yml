server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  boot:
    admin:
      client:
        url: ${ADMIN_SERVER_URL:http://localhost:9090}
        instance:
          service-base-url: ${SERVICE_BASE_URL:http://localhost:${SERVER_PORT:8080}}
          management-base-url: ${MANAGEMENT_BASE_URL:http://localhost:${SERVER_PORT:8080}}
          service-url: ${SERVICE_URL:${SERVICE_BASE_URL:http://localhost:${SERVER_PORT:8080}}}
          management-url: ${MANAGEMENT_URL:${MANAGEMENT_BASE_URL:http://localhost:${SERVER_PORT:8080}}/actuator}
          health-url: ${HEALTH_URL:${MANAGEMENT_BASE_URL:http://localhost:${SERVER_PORT:8080}}/actuator/health}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  codec:
    max-in-memory-size: 10MB
  cloud:
    loadbalancer:
      cache:
        enabled: true
        ttl: 35s
        capacity: 256
      retry:
        enabled: true
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${FRONTEND_URL:http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - name: CircuitBreaker
          args:
            name: gatewayCircuitBreaker
            fallbackUri: forward:/fallback
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**,/api/author-request/**,/api/admin/author-request/**,/api/admin/author-requests/**,/api/feedback/**,/api/admin/feedback/**
        - id: auth-oauth
          uri: lb://auth-service
          predicates:
            - Path=/oauth2/**,/login/**
        - id: post-service
          uri: lb://post-service
          predicates:
            - Path=/api/posts/**,/api/reading-history/**
        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/api/comments/**
        - id: category-service
          uri: lb://category-service
          predicates:
            - Path=/api/categories/**
        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/media/**
        - id: newsletter-service
          uri: lb://newsletter-service
          predicates:
            - Path=/api/newsletter/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userOrIpKeyResolver}"
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**,/api/admin/notifications/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
        - id: auth-swagger
          uri: lb://auth-service
          predicates:
            - Path=/auth-service/v3/api-docs
          filters:
            - RewritePath=/auth-service/v3/api-docs, /v3/api-docs
        - id: post-swagger
          uri: lb://post-service
          predicates:
            - Path=/post-service/v3/api-docs
          filters:
            - RewritePath=/post-service/v3/api-docs, /v3/api-docs
        - id: comment-swagger
          uri: lb://comment-service
          predicates:
            - Path=/comment-service/v3/api-docs
          filters:
            - RewritePath=/comment-service/v3/api-docs, /v3/api-docs
        - id: category-swagger
          uri: lb://category-service
          predicates:
            - Path=/category-service/v3/api-docs
          filters:
            - RewritePath=/category-service/v3/api-docs, /v3/api-docs
        - id: media-swagger
          uri: lb://media-service
          predicates:
            - Path=/media-service/v3/api-docs
          filters:
            - RewritePath=/media-service/v3/api-docs, /v3/api-docs
        - id: newsletter-swagger
          uri: lb://newsletter-service
          predicates:
            - Path=/newsletter-service/v3/api-docs
          filters:
            - RewritePath=/newsletter-service/v3/api-docs, /v3/api-docs
        - id: notification-swagger
          uri: lb://notification-service
          predicates:
            - Path=/notification-service/v3/api-docs
          filters:
            - RewritePath=/notification-service/v3/api-docs, /v3/api-docs
        - id: payment-swagger
          uri: lb://payment-service
          predicates:
            - Path=/payment-service/v3/api-docs
          filters:
            - RewritePath=/payment-service/v3/api-docs, /v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

security:
  jwt:
    # JWT_SECRET must be supplied from .env/Jenkins/EC2; do not commit token signing keys.
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      gatewayCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 4s
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    instances:
      gatewayCircuitBreaker:
        timeoutDuration: 5s

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls-primary-name: auth-service
    filter: true
    try-it-out-enabled: true
    syntax-highlight:
      activated: true
