server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: category-service
  boot:
    admin:
      client:
        url: ${ADMIN_SERVER_URL:http://localhost:9090}
        instance:
          service-base-url: ${SERVICE_BASE_URL:http://localhost:${SERVER_PORT:8083}}
          management-base-url: ${MANAGEMENT_BASE_URL:http://localhost:${SERVER_PORT:8083}}
          service-url: ${SERVICE_URL:${SERVICE_BASE_URL:http://localhost:${SERVER_PORT:8083}}}
          management-url: ${MANAGEMENT_URL:${MANAGEMENT_BASE_URL:http://localhost:${SERVER_PORT:8083}}/actuator}
          health-url: ${HEALTH_URL:${MANAGEMENT_BASE_URL:http://localhost:${SERVER_PORT:8083}}/actuator/health}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:category_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    # DB_PASSWORD must come from .env or the deployment environment.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
