server:
  port: ${SERVER_PORT:9090}

spring:
  application:
    name: admin-server
  boot:
    admin:
      ui:
        title: InkWell Admin Server

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
