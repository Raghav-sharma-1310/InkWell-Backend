spring:
  datasource:
    url: jdbc:h2:mem:post_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  data:
    redis:
      repositories:
        enabled: false
  rabbitmq:
    listener:
      type: simple
      simple:
        auto-startup: false
  main:
    allow-bean-definition-overriding: true

eureka:
  client:
    enabled: false

resilience4j:
  circuitbreaker:
    enabled: false
  retry:
    enabled: false
